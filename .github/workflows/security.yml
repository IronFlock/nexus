# Security screening from the shared IronFlock CI harness: secrets, Go
# dependencies (govulncheck), semgrep, configuration, licences and the SBOM.
# The library's own checks stay in main-golint.yml. No image scan: the
# Dockerfile installs nexusd from the published module (go install
# ...@version), not from this checkout, and the services that embed nexus
# scan their images in their own repositories.
#
# Blocking: the `report` job fails on secrets, fixable high/critical
# vulnerabilities, high misconfigurations, forbidden licences and semgrep
# errors. Accepted findings go into .trivyignore.yaml /
# security/vex.openvex.json / .gitleaks.toml with a reason.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 07:53 UTC: catch CVEs disclosed against unchanged code.
    - cron: "53 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    uses: IronFlock/workflows/.github/workflows/security.yml@v1
    permissions:
      contents: read
      security-events: write
    with:
      languages: go
      # gosec runs in main-golint.yml; semgrep adds only the IronFlock rules.
      semgrep-rulesets: ""
      fail-on: secrets,vuln-critical,vuln-high,misconfig-high,license-forbidden,semgrep-error
